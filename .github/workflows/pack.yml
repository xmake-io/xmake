name: Pack

on:
  pull_request:
  push:

jobs:
  linux:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Pack-Linux
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Prepare local xmake
        run: cp -rf . ../xmake-source
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: local#../xmake-source
      - name: Install packaging tools
        run: |
          sudo apt update
          sudo apt install -y devscripts rpm nsis
      - name: Run linux pack validation
        run: bash tests/plugins/pack/launcher_app/ci/linux.sh

  macos:
    runs-on: macos-latest
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Pack-macOS
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Prepare local xmake
        run: cp -rf . ../xmake-source
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: local#../xmake-source
      - name: Run macos pack validation
        run: bash tests/plugins/pack/launcher_app/ci/macos.sh

  # best-effort: local xmake setup is reported as unsupported on windows
  # runners (see windows.yml), so this job may need adjustment there.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-Pack-Windows
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Prepare local xmake
        run: xcopy /E /I /Y . ..\xmake-source
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: local#..\xmake-source
      - name: Run windows pack validation
        shell: pwsh
        run: tests/plugins/pack/launcher_app/ci/windows.ps1
